<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Wars - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0a0a1a;
            color: #fff;
            display: flex;
            min-height: 100vh;
        }

        /* ===== الشريط الجانبي ===== */
        .sidebar {
            width: 160px;
            background: rgba(255, 255, 255, 0.02);
            border-left: 1px solid rgba(255, 255, 255, 0.03);
            padding: 16px 10px;
            height: 100vh;
            position: sticky;
            top: 0;
            flex-shrink: 0;
        }

        .sidebar .logo {
            font-size: 0.85rem;
            font-weight: 800;
            padding: 4px 10px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar .logo i { color: #6366f1; }

        .sidebar .nav-item {
            padding: 6px 10px;
            border-radius: 6px;
            color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            font-weight: 500;
            font-size: 0.7rem;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .sidebar .nav-item:hover { background: rgba(255, 255, 255, 0.03); color: rgba(255, 255, 255, 0.4); }
        .sidebar .nav-item.active { background: rgba(79, 70, 229, 0.08); color: #a5b4fc; }

        /* ===== المحتوى ===== */
        .main {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header h1 {
            font-size: 1.1rem;
            font-weight: 800;
        }
        .header h1 span { color: #6366f1; }

        .header .admin-badge {
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 14px;
            border-radius: 16px;
            font-size: 0.65rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* ===== البطاقات ===== */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 18px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 12px 14px;
        }

        .stat-card .label {
            color: rgba(255, 255, 255, 0.12);
            font-size: 0.55rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .stat-card .value {
            font-size: 1.2rem;
            font-weight: 800;
            margin-top: 2px;
        }

        /* ===== اللوحات ===== */
        .panel { display: none; }
        .panel.active { display: block; animation: fade 0.2s ease; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

        .table-wrap {
            overflow-x: auto;
            background: rgba(255, 255, 255, 0.015);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 2px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.7rem;
        }
        th {
            text-align: right;
            padding: 8px 12px;
            color: rgba(255, 255, 255, 0.12);
            font-weight: 600;
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        td {
            padding: 6px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.015);
            color: rgba(255, 255, 255, 0.35);
        }

        .btn-sm {
            padding: 2px 8px;
            border: none;
            border-radius: 4px;
            font-size: 0.55rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .btn-sm.primary { background: rgba(79, 70, 229, 0.08); color: #a5b4fc; }
        .btn-sm.primary:hover { background: rgba(79, 70, 229, 0.15); }

        .btn-sm.danger { background: rgba(239, 68, 68, 0.06); color: #f87171; }
        .btn-sm.danger:hover { background: rgba(239, 68, 68, 0.12); }

        .btn-sm.success { background: rgba(52, 211, 153, 0.06); color: #34d399; }
        .btn-sm.success:hover { background: rgba(52, 211, 153, 0.12); }

        /* ===== الإعدادات ===== */
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px;
        }

        .setting-item {
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .setting-item .label {
            font-size: 0.65rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.25);
        }

        .setting-item input,
        .setting-item select {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            padding: 4px 8px;
            color: #fff;
            font-family: inherit;
            font-size: 0.7rem;
            outline: none;
            min-width: 80px;
        }

        .setting-item input[type="color"] { width: 30px; height: 28px; padding: 2px; cursor: pointer; min-width: unset; }

        /* ===== السجلات ===== */
        .log-entry {
            padding: 4px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.015);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.15);
        }

        .log-entry .time { color: rgba(255, 255, 255, 0.05); font-size: 0.55rem; }
        .log-entry .user { color: #a5b4fc; font-weight: 500; }

        /* ===== استجابة ===== */
        @media (max-width: 700px) {
            body { flex-direction: column; }
            .sidebar {
                width: 100%;
                height: auto;
                padding: 10px 16px;
                border-left: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.03);
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
            }
            .sidebar .logo { margin-bottom: 0; padding: 0; }
            .sidebar .nav-items { display: flex; flex-wrap: wrap; gap: 3px; }
            .sidebar .nav-item { padding: 4px 8px; font-size: 0.6rem; }
            .main { padding: 12px; }
            .stats { grid-template-columns: 1fr 1fr; }
            .header h1 { font-size: 0.95rem; }
        }

        @media (max-width: 420px) {
            .stats { grid-template-columns: 1fr; }
            .settings-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 0.8rem; }
            .sidebar .nav-item { font-size: 0.55rem; padding: 3px 6px; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo"><i class="fas fa-gamepad"></i> Game Wars</div>
        <div class="nav-items">
            <div class="nav-item active" data-tab="dashboard"><i class="fas fa-chart-pie"></i> لوحة</div>
            <div class="nav-item" data-tab="users"><i class="fas fa-users"></i> المستخدمين</div>
            <div class="nav-item" data-tab="settings"><i class="fas fa-sliders-h"></i> إعدادات</div>
            <div class="nav-item" data-tab="logs"><i class="fas fa-history"></i> سجلات</div>
            <div class="nav-item" onclick="logout()" style="margin-top:10px;border-top:1px solid rgba(255,255,255,0.03);padding-top:10px;"><i class="fas fa-sign-out-alt"></i> خروج</div>
        </div>
    </aside>

    <main class="main">
        <div class="header">
            <h1>👑 لوحة <span>Game Wars</span></h1>
            <div class="admin-badge" id="adminBadge">admin</div>
        </div>

        <!-- لوحة -->
        <div class="panel active" id="panel-dashboard">
            <div class="stats" id="statsGrid">
                <div class="stat-card"><div class="label">المستخدمين</div><div class="value" id="statUsers">0</div></div>
                <div class="stat-card"><div class="label">تسجيلات اليوم</div><div class="value" id="statToday">0</div></div>
                <div class="stat-card"><div class="label">دخول اليوم</div><div class="value" id="statLogins">0</div></div>
            </div>
            <div id="recentLogs" style="background:rgba(255,255,255,0.015);border-radius:12px;border:1px solid rgba(255,255,255,0.03);padding:10px;"></div>
        </div>

        <!-- المستخدمين -->
        <div class="panel" id="panel-users">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;">
                <span style="color:rgba(255,255,255,0.12);font-size:0.65rem;"><i class="fas fa-users"></i> قائمة المستخدمين</span>
                <button class="btn-sm primary" onclick="loadUsers()"><i class="fas fa-sync-alt"></i> تحديث</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>المستخدم</th><th>الدور</th><th>الحالة</th><th>تاريخ التسجيل</th><th>الإجراءات</th></tr></thead>
                    <tbody id="usersTable"></tbody>
                </table>
            </div>
        </div>

        <!-- إعدادات -->
        <div class="panel" id="panel-settings">
            <div class="settings-grid" id="settingsGrid"></div>
            <button class="btn-sm primary" style="margin-top:12px;padding:5px 18px;" onclick="saveSettings()"><i class="fas fa-save"></i> حفظ</button>
        </div>

        <!-- سجلات -->
        <div class="panel" id="panel-logs">
            <div id="logsContainer"></div>
        </div>
    </main>

    <script>
        const API = window.location.hostname === 'localhost' ? 'http://localhost:3000' : 'https://game22-hoas.onrender.com';
        let token = localStorage.getItem('token');

        async function apiFetch(endpoint, options = {}) {
            const res = await fetch(`${API}${endpoint}`, {
                ...options,
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...options.headers }
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'خطأ');
            return data;
        }

        async function verifyAdmin() {
            if (!token) {
                window.location.href = '/';
                return false;
            }
            try {
                const data = await apiFetch('/api/verify');
                if (data.role !== 'admin') {
                    window.location.href = '/';
                    return false;
                }
                document.getElementById('adminBadge').textContent = `admin • ${data.username}`;
                return true;
            } catch (e) {
                window.location.href = '/';
                return false;
            }
        }

        async function loadStats() {
            try {
                const stats = await apiFetch('/api/admin/stats');
                document.getElementById('statUsers').textContent = stats.totalUsers;
                document.getElementById('statToday').textContent = stats.todayRegistrations;
                document.getElementById('statLogins').textContent = stats.todayLogins;
            } catch (e) {}
        }

        async function loadUsers() {
            try {
                const users = await apiFetch('/api/admin/users');
                document.getElementById('usersTable').innerHTML = users.map(u => `
                    <tr>
                        <td><strong style="color:rgba(255,255,255,0.5);font-size:0.75rem;">${u.username}</strong></td>
                        <td style="font-size:0.65rem;">${u.role}</td>
                        <td><span style="color:${u.is_active ? '#34d399' : '#f87171'};font-size:0.65rem;">${u.is_active ? 'نشط' : 'معطل'}</span></td>
                        <td style="font-size:0.55rem;color:rgba(255,255,255,0.08);">${new Date(u.created_at).toLocaleDateString('ar')}</td>
                        <td>
                            ${u.username !== 'noor2613857noor' ? `
                                <button class="btn-sm ${u.is_active ? 'danger' : 'success'}" onclick="toggleUser('${u.username}', ${!u.is_active})">
                                    <i class="fas ${u.is_active ? 'fa-ban' : 'fa-check'}"></i>
                                </button>
                                <button class="btn-sm danger" onclick="deleteUser('${u.username}')"><i class="fas fa-trash"></i></button>
                            ` : '<span style="color:rgba(255,255,255,0.08);font-size:0.7rem;">👑</span>'}
                        </td>
                    </tr>
                `).join('');
            } catch (e) {}
        }

        async function loadSettings() {
            try {
                const settings = await apiFetch('/api/admin/settings');
                const grid = document.getElementById('settingsGrid');
                const labels = {
                    site_name: 'اسم الموقع',
                    primary_color: 'اللون الأساسي',
                    secondary_color: 'اللون الثانوي',
                    accent_color: 'لون التمييز'
                };
                grid.innerHTML = Object.entries(settings).filter(([k]) => k !== 'background_color' && k !== 'text_color').map(([k, v]) => {
                    let input = k.includes('color') ? `<input type="color" value="${v}" data-key="${k}" />` :
                        `<input type="text" value="${v}" data-key="${k}" />`;
                    return `<div class="setting-item"><span class="label">${labels[k] || k}</span>${input}</div>`;
                }).join('');
            } catch (e) {}
        }

        async function saveSettings() {
            const inputs = document.querySelectorAll('#settingsGrid input');
            try {
                for (const el of inputs) {
                    await apiFetch('/api/admin/settings', {
                        method: 'POST',
                        body: JSON.stringify({ key: el.dataset.key, value: el.value })
                    });
                }
                alert('✅ تم حفظ الإعدادات');
            } catch (e) { alert('❌ خطأ في الحفظ'); }
        }

        async function loadLogs() {
            try {
                const logs = await apiFetch('/api/admin/logs');
                document.getElementById('logsContainer').innerHTML = logs.map(log => `
                    <div class="log-entry">
                        <span class="time">${new Date(log.created_at).toLocaleString('ar')}</span>
                        <span class="user">${log.username}</span>
                        <span>${log.action} ${log.details || ''}</span>
                    </div>
                `).join('') || '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.04);font-size:0.7rem;">لا توجد سجلات</div>';
            } catch (e) {}
        }

        async function loadRecent() {
            try {
                const logs = await apiFetch('/api/admin/logs?limit=5');
                document.getElementById('recentLogs').innerHTML = logs.map(log => `
                    <div class="log-entry" style="padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.015);">
                        <span class="time">${new Date(log.created_at).toLocaleString('ar')}</span>
                        <span class="user">${log.username}</span>
                        <span style="color:rgba(255,255,255,0.08);">${log.action}</span>
                    </div>
                `).join('') || '<div style="text-align:center;padding:10px;color:rgba(255,255,255,0.04);font-size:0.7rem;">لا توجد سجلات حديثة</div>';
            } catch (e) {}
        }

        async function toggleUser(username, active) {
            if (!confirm(`تأكيد ${active ? 'تفعيل' : 'تعطيل'} المستخدم ${username}؟`)) return;
            try {
                await apiFetch('/api/admin/toggle-user', {
                    method: 'POST',
                    body: JSON.stringify({ username, active })
                });
                loadUsers();
            } catch (e) { alert('❌ خطأ'); }
        }

        async function deleteUser(username) {
            if (!confirm(`حذف المستخدم ${username}؟`)) return;
            try {
                await apiFetch('/api/admin/delete-user', {
                    method: 'DELETE',
                    body: JSON.stringify({ username })
                });
                loadUsers();
                loadStats();
            } catch (e) { alert('❌ خطأ'); }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/';
        }

        // ===== التبويبات =====
        document.querySelectorAll('.nav-item[data-tab]').forEach(item => {
            item.onclick = () => {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                item.classList.add('active');
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                document.getElementById(`panel-${item.dataset.tab}`).classList.add('active');
            };
        });

        // ===== تهيئة =====
        async function init() {
            if (!await verifyAdmin()) return;
            await loadStats();
            await loadUsers();
            await loadSettings();
            await loadLogs();
            await loadRecent();
        }

        init();
    </script>
</body>
</html>
