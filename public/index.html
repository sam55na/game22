<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Wars</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0a0a1a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== الشريط العلوي ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(10, 10, 26, 0.92);
            backdrop-filter: blur(16px);
            padding: 6px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 50px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            gap: 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            font-weight: 800;
            flex-shrink: 0;
        }

        .brand i {
            font-size: 1.1rem;
            color: #6366f1;
        }

        .brand .letters {
            display: flex;
            gap: 0px;
            direction: ltr;
        }

        .brand .letters span {
            display: inline-block;
            animation: fall 4.5s ease-in-out infinite;
            animation-delay: calc(var(--i) * 0.12s);
            font-weight: 800;
            font-size: 1rem;
        }

        @keyframes fall {
            0% {
                transform: translateY(-40px) rotate(160deg);
                opacity: 0;
            }
            12% {
                transform: translateY(0) rotate(0);
                opacity: 1;
            }
            82% {
                transform: translateY(0) rotate(0);
                opacity: 1;
            }
            100% {
                transform: translateY(25px) rotate(-12deg);
                opacity: 0;
            }
        }

        .brand .letters span:nth-child(1) { --i: 0; }
        .brand .letters span:nth-child(2) { --i: 1; }
        .brand .letters span:nth-child(3) { --i: 2; }
        .brand .letters span:nth-child(4) { --i: 3; }
        .brand .letters span:nth-child(5) { --i: 4; }
        .brand .letters span:nth-child(6) { --i: 5; }
        .brand .letters span:nth-child(7) { --i: 6; }
        .brand .letters span:nth-child(8) { --i: 7; }
        .brand .letters span:nth-child(9) { --i: 8; }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn {
            padding: 4px 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5, #0891b2);
            color: #fff;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(79, 70, 229, 0.2); }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.4);
        }
        .btn-outline:hover { background: rgba(255, 255, 255, 0.04); color: #fff; }

        .btn-danger {
            background: rgba(239, 68, 68, 0.08);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.06);
        }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.15); }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f46e5, #0891b2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* ===== المحتوى ===== */
        .main {
            margin-top: 58px;
            padding: 16px 20px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            flex: 1;
            width: 100%;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.06);
        }

        .empty-state i {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 10px;
        }
        .empty-state h2 {
            color: rgba(255, 255, 255, 0.12);
            font-weight: 700;
            font-size: 1.1rem;
        }
        .empty-state p {
            color: rgba(255, 255, 255, 0.04);
            font-size: 0.75rem;
            margin-top: 4px;
        }

        /* ===== نموذج المصادقة ===== */
        .auth-box {
            max-width: 320px;
            margin: 12px auto;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            padding: 20px 18px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .tabs {
            display: flex;
            gap: 3px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            padding: 3px;
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            padding: 6px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 600;
            font-size: 0.7rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .tab-btn.active {
            background: rgba(79, 70, 229, 0.12);
            color: #a5b4fc;
        }
        .tab-btn:hover:not(.active) { color: rgba(255, 255, 255, 0.4); }

        .form { display: none; }
        .form.active { display: block; animation: fadeUp 0.25s ease; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-group label {
            display: block;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 3px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.06);
            font-size: 0.7rem;
        }

        .input-wrap input {
            width: 100%;
            padding: 7px 32px 7px 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            color: #fff;
            font-size: 0.8rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-wrap input:focus {
            border-color: rgba(79, 70, 229, 0.25);
            background: rgba(255, 255, 255, 0.05);
        }
        .input-wrap input::placeholder { color: rgba(255, 255, 255, 0.05); }

        .submit-btn {
            width: 100%;
            padding: 8px;
            background: linear-gradient(135deg, #4f46e5, #0891b2);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            margin-top: 2px;
        }

        .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(79, 70, 229, 0.15); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        .msg {
            margin-top: 10px;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            display: none;
            text-align: center;
        }

        .msg.error { display: block; background: rgba(239, 68, 68, 0.06); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.04); }
        .msg.success { display: block; background: rgba(52, 211, 153, 0.06); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.04); }

        /* ===== استجابة ===== */
        @media (max-width: 700px) {
            .navbar { padding: 4px 12px; height: 44px; }
            .brand { font-size: 0.85rem; gap: 6px; }
            .brand .letters span { font-size: 0.85rem; }
            .main { padding: 12px; margin-top: 50px; }
            .auth-box { padding: 16px 14px; max-width: 100%; margin: 8px 0; }
            .btn span { display: none; }
            .nav-actions { gap: 5px; }
            .btn { padding: 3px 8px; font-size: 0.65rem; }
            .avatar { width: 24px; height: 24px; font-size: 0.6rem; }
        }

        @media (max-width: 420px) {
            .brand { font-size: 0.75rem; gap: 4px; }
            .brand .letters span { font-size: 0.75rem; }
            .brand i { font-size: 0.85rem; }
            .auth-box { padding: 12px 10px; border-radius: 14px; }
            .input-wrap input { padding: 5px 28px 5px 8px; font-size: 0.7rem; }
            .submit-btn { padding: 6px; font-size: 0.7rem; }
            .tab-btn { font-size: 0.6rem; padding: 4px; }
            .btn { padding: 2px 6px; font-size: 0.55rem; }
            .empty-state i { font-size: 1.8rem; }
            .empty-state h2 { font-size: 0.9rem; }
        }

        @media (max-width: 360px) {
            .brand .letters span { font-size: 0.65rem; }
            .brand i { font-size: 0.7rem; }
            .nav-actions { gap: 3px; }
            .avatar { width: 20px; height: 20px; font-size: 0.5rem; }
            .btn { padding: 2px 5px; font-size: 0.5rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">
            <i class="fas fa-gamepad"></i>
            <div class="letters" dir="ltr">
                <span>G</span><span>a</span><span>m</span><span>e</span>
                <span style="margin-right:2px;"></span>
                <span>W</span><span>a</span><span>r</span><span>s</span>
            </div>
        </div>
        <div class="nav-actions" id="navActions"></div>
    </nav>

    <div class="main">
        <div class="empty-state" id="emptyState">
            <i class="fas fa-gamepad"></i>
            <h2>Game Wars</h2>
            <p>سجل الدخول لبدء التجربة</p>
        </div>

        <div class="auth-box" id="authBox">
            <div class="tabs">
                <button class="tab-btn active" data-tab="login"><i class="fas fa-sign-in-alt"></i> دخول</button>
                <button class="tab-btn" data-tab="register"><i class="fas fa-user-plus"></i> حساب</button>
            </div>

            <div class="form active" id="loginForm">
                <div class="input-group">
                    <label>اسم المستخدم</label>
                    <div class="input-wrap">
                        <i class="fas fa-user"></i>
                        <input type="text" id="loginUsername" placeholder="اسم المستخدم" />
                    </div>
                </div>
                <div class="input-group">
                    <label>كلمة المرور</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="كلمة المرور" />
                    </div>
                </div>
                <button class="submit-btn" id="loginBtn">دخول</button>
                <div class="msg" id="loginMsg"></div>
            </div>

            <div class="form" id="registerForm">
                <div class="input-group">
                    <label>اسم المستخدم</label>
                    <div class="input-wrap">
                        <i class="fas fa-user"></i>
                        <input type="text" id="registerUsername" placeholder="3 أحرف على الأقل" />
                    </div>
                </div>
                <div class="input-group">
                    <label>كلمة المرور</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="registerPassword" placeholder="8 أحرف على الأقل" />
                    </div>
                </div>
                <button class="submit-btn" id="registerBtn">إنشاء حساب</button>
                <div class="msg" id="registerMsg"></div>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.hostname === 'localhost' ? 'http://localhost:3000' : 'https://game22-hoas.onrender.com';

        function showMsg(el, text, type = 'error') {
            el.textContent = text;
            el.className = `msg ${type}`;
        }

        function setLoading(btn, loading) {
            btn.disabled = loading;
            btn.textContent = loading ? 'جاري...' : btn.dataset.original;
        }

        document.querySelectorAll('.submit-btn').forEach(b => b.dataset.original = b.textContent);

        // ===== تحديث الشريط =====
        function updateNavbar(user) {
            const nav = document.getElementById('navActions');
            if (user) {
                nav.innerHTML = `
                    <div class="avatar">${user.username.charAt(0)}</div>
                    <button class="btn btn-danger" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> <span>خروج</span></button>
                `;
                document.getElementById('logoutBtn').onclick = () => { localStorage.clear(); location.reload(); };
                document.getElementById('authBox').style.display = 'none';
                document.getElementById('emptyState').innerHTML = `
                    <i class="fas fa-gamepad"></i>
                    <h2>مرحباً ${user.username}</h2>
                    <p style="color:rgba(255,255,255,0.04);">أنت مسجل الدخول</p>
                `;
            } else {
                nav.innerHTML = `<button class="btn btn-primary" id="showLogin"><i class="fas fa-sign-in-alt"></i> <span>دخول</span></button>`;
                document.getElementById('showLogin').onclick = () => {
                    document.getElementById('authBox').scrollIntoView({ behavior: 'smooth' });
                };
                document.getElementById('authBox').style.display = 'block';
                document.getElementById('emptyState').innerHTML = `
                    <i class="fas fa-gamepad"></i>
                    <h2>Game Wars</h2>
                    <p style="color:rgba(255,255,255,0.04);">سجل الدخول لبدء التجربة</p>
                `;
            }
        }

        // ===== تسجيل الدخول =====
        document.getElementById('loginBtn').onclick = async () => {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const msg = document.getElementById('loginMsg');
            const btn = document.getElementById('loginBtn');

            if (!username || !password) return showMsg(msg, 'املأ جميع الحقول');

            setLoading(btn, true);
            try {
                const res = await fetch(`${API}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                showMsg(msg, '✅ تم الدخول', 'success');
                setTimeout(() => updateNavbar(data.user), 300);
            } catch (e) {
                showMsg(msg, '❌ ' + e.message);
            } finally {
                setLoading(btn, false);
            }
        };

        // ===== إنشاء حساب =====
        document.getElementById('registerBtn').onclick = async () => {
            const username = document.getElementById('registerUsername').value.trim();
            const password = document.getElementById('registerPassword').value.trim();
            const msg = document.getElementById('registerMsg');
            const btn = document.getElementById('registerBtn');

            if (!username || !password) return showMsg(msg, 'املأ جميع الحقول');
            if (username.length < 3) return showMsg(msg, 'اسم المستخدم 3 أحرف على الأقل');
            if (password.length < 8) return showMsg(msg, 'كلمة المرور 8 أحرف على الأقل');

            setLoading(btn, true);
            try {
                const res = await fetch(`${API}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                showMsg(msg, '✅ تم إنشاء الحساب', 'success');
                document.getElementById('registerUsername').value = '';
                document.getElementById('registerPassword').value = '';
                setTimeout(() => document.querySelector('[data-tab="login"]').click(), 500);
            } catch (e) {
                showMsg(msg, '❌ ' + e.message);
            } finally {
                setLoading(btn, false);
            }
        };

        // ===== التبويبات =====
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const tab = btn.dataset.tab;
                document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
                document.getElementById(tab === 'login' ? 'loginForm' : 'registerForm').classList.add('active');
                document.querySelectorAll('.msg').forEach(m => { m.className = 'msg'; m.textContent = ''; });
            };
        });

        // ===== Enter =====
        document.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const form = inp.closest('.form');
                    if (form.id === 'loginForm') document.getElementById('loginBtn').click();
                    else document.getElementById('registerBtn').click();
                }
            });
        });

        // ===== استعادة الجلسة =====
        (function() {
            const userData = localStorage.getItem('user');
            if (userData) {
                try {
                    const user = JSON.parse(userData);
                    if (user.username) updateNavbar(user);
                } catch (_) { localStorage.clear(); }
            } else {
                updateNavbar(null);
            }
        })();

        // ===== إصلاح مشكلة لوحة الإدارة =====
        // التحقق من صلاحية الأدمن عند تحميل الصفحة
        async function checkAdminAccess() {
            const token = localStorage.getItem('token');
            if (!token) return;

            try {
                const res = await fetch(`${API}/api/verify`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.role === 'admin') {
                    // إضافة زر لوحة الإدارة في الشريط
                    const nav = document.getElementById('navActions');
                    if (!document.getElementById('adminLink')) {
                        const adminBtn = document.createElement('a');
                        adminBtn.id = 'adminLink';
                        adminBtn.href = '/admin';
                        adminBtn.style.cssText = `
                            color: #a5b4fc;
                            font-size: 0.7rem;
                            font-weight: 600;
                            text-decoration: none;
                            padding: 3px 10px;
                            border-radius: 6px;
                            border: 1px solid rgba(79,70,229,0.15);
                            background: rgba(79,70,229,0.05);
                            transition: all 0.2s ease;
                        `;
                        adminBtn.textContent = '👑 لوحة';
                        adminBtn.onmouseover = () => { adminBtn.style.background = 'rgba(79,70,229,0.1)'; };
                        adminBtn.onmouseout = () => { adminBtn.style.background = 'rgba(79,70,229,0.05)'; };
                        nav.prepend(adminBtn);
                    }
                }
            } catch (e) {}
        }

        // استدعاء التحقق بعد تحميل الصفحة
        setTimeout(checkAdminAccess, 500);
    </script>
</body>
</html>
