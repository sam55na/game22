<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Game Wars</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ===== متغيرات الألوان ===== */
        :root {
            --primary: #6366f1;
            --secondary: #0891b2;
            --accent: #8b5cf6;
            --bg: #0a0a1a;
            --text: #ffffff;
            --card-bg: rgba(255,255,255,0.03);
            --border: rgba(255,255,255,0.05);
            --glow: rgba(99,102,241,0.15);
            --radius: 16px;
            --transition: 0.3s ease;
            --font-size: 16px;
            --deposit-color: #22d3ee;
            --withdraw-color: #f472b6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-text-size-adjust: 100%;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-size: var(--font-size);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background 0.3s ease, color 0.3s ease;
        }

        input,
        select,
        textarea,
        button {
            font-size: 16px !important;
        }

        /* ===== خلفية متحركة ===== */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 25s ease-in-out infinite;
            transition: background 0.3s ease;
        }
        .bg-orb.orb1 {
            width: 500px;
            height: 500px;
            background: var(--primary);
            top: -100px;
            right: -100px;
        }
        .bg-orb.orb2 {
            width: 400px;
            height: 400px;
            background: var(--secondary);
            bottom: -50px;
            left: -50px;
            animation-delay: -8s;
        }
        .bg-orb.orb3 {
            width: 300px;
            height: 300px;
            background: var(--accent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -15s;
        }
        @keyframes orbFloat {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(-60px, 50px) scale(1.1);
            }
        }

        /* ===== الشريط العلوي ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(10, 10, 26, 0.92);
            backdrop-filter: blur(16px);
            padding: 10px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
            border-bottom: 1px solid var(--border);
            transition: border-color 0.3s ease;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.4rem;
            font-weight: 800;
        }
        .brand i {
            font-size: 1.6rem;
            color: var(--primary);
            transition: color 0.3s ease;
        }
        .brand .letters {
            display: flex;
            gap: 0px;
            direction: ltr;
        }
        .brand .letters span {
            display: inline-block;
            animation: letterFall 4.5s ease-in-out infinite;
            animation-delay: calc(var(--i) * 0.12s);
            font-weight: 800;
            font-size: 1.4rem;
        }
        @keyframes letterFall {
            0% {
                transform: translateY(-50px) rotate(160deg);
                opacity: 0;
            }
            12% {
                transform: translateY(0) rotate(0);
                opacity: 1;
            }
            82% {
                transform: translateY(0) rotate(0);
                opacity: 1;
            }
            100% {
                transform: translateY(30px) rotate(-12deg);
                opacity: 0;
            }
        }
        .brand .letters span:nth-child(1) { --i: 0; }
        .brand .letters span:nth-child(2) { --i: 1; }
        .brand .letters span:nth-child(3) { --i: 2; }
        .brand .letters span:nth-child(4) { --i: 3; }
        .brand .letters span:nth-child(5) { --i: 4; }
        .brand .letters span:nth-child(6) { --i: 5; }
        .brand .letters span:nth-child(7) { --i: 6; }
        .brand .letters span:nth-child(8) { --i: 7; }
        .brand .letters span:nth-child(9) { --i: 8; }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            min-height: 40px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px var(--glow);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: rgba(255, 255, 255, 0.5);
        }
        .btn-outline:hover {
            background: var(--card-bg);
            color: #fff;
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.08);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.06);
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.15);
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.3s ease;
        }
        .balance-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(251, 191, 36, 0.08);
            border: 1px solid rgba(251, 191, 36, 0.06);
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #fbbf24;
        }
        .balance-badge i {
            font-size: 0.9rem;
        }

        /* ===== شريط الإيداع والسحب ===== */
        .action-bar {
            position: fixed;
            top: 64px;
            left: 0;
            right: 0;
            z-index: 99;
            background: rgba(10, 10, 26, 0.85);
            backdrop-filter: blur(12px);
            padding: 8px 28px;
            display: none;
            justify-content: center;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--border);
            transition: all 0.3s ease;
            flex-wrap: wrap;
        }
        .action-bar.active {
            display: flex;
        }

        .action-bar .action-btn {
            padding: 8px 28px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 44px;
            position: relative;
            overflow: hidden;
        }

        .action-bar .action-btn i {
            font-size: 1.1rem;
        }

        .action-bar .action-btn.deposit {
            background: linear-gradient(135deg, var(--deposit-color), #0ea5e9);
            color: #0a0a1a;
            box-shadow: 0 4px 20px rgba(34, 211, 238, 0.25);
        }
        .action-bar .action-btn.deposit:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 30px rgba(34, 211, 238, 0.4);
        }

        .action-bar .action-btn.withdraw {
            background: linear-gradient(135deg, var(--withdraw-color), #ec4899);
            color: #0a0a1a;
            box-shadow: 0 4px 20px rgba(244, 114, 182, 0.25);
        }
        .action-bar .action-btn.withdraw:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 30px rgba(244, 114, 182, 0.4);
        }

        .action-bar .action-btn .badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #fbbf24;
            color: #0a0a1a;
            font-size: 0.6rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 20px;
            animation: pulse-badge 2s ease-in-out infinite;
        }

        @keyframes pulse-badge {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* ===== المحتوى ===== */
        .main {
            margin-top: 76px;
            padding: 24px 32px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            flex: 1;
            width: 100%;
            position: relative;
            z-index: 1;
            transition: margin-top 0.3s ease;
        }
        .main.with-action-bar {
            margin-top: 120px;
        }

        /* ===== صفحة تسجيل الدخول ===== */
        .auth-box {
            max-width: 420px;
            margin: 30px auto;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 32px 28px;
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .auth-box .logo-icon {
            text-align: center;
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 16px;
            transition: color 0.3s ease;
        }
        .auth-box h2 {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text);
        }

        .tabs {
            display: flex;
            gap: 6px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 6px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .tab-btn.active {
            background: rgba(99, 102, 241, 0.12);
            color: #a5b4fc;
        }
        .tab-btn:hover:not(.active) {
            color: rgba(255, 255, 255, 0.5);
        }

        .form {
            display: none;
        }
        .form.active {
            display: block;
            animation: fadeUp 0.3s ease;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-group {
            margin-bottom: 14px;
        }
        .input-group label {
            display: block;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap i {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.08);
            font-size: 0.9rem;
        }
        .input-wrap input {
            width: 100%;
            padding: 12px 44px 12px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: all var(--transition);
            min-height: 48px;
        }
        .input-wrap input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 4px var(--glow);
        }
        .input-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.06);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            margin-top: 4px;
            min-height: 48px;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px var(--glow);
        }
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .msg {
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            display: none;
            text-align: center;
        }
        .msg.error {
            display: block;
            background: rgba(239, 68, 68, 0.06);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.04);
        }
        .msg.success {
            display: block;
            background: rgba(52, 211, 153, 0.06);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.04);
        }
        .msg.bonus {
            display: block;
            background: rgba(251, 191, 36, 0.06);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.04);
        }
        .msg.loading {
            display: block;
            background: rgba(99, 102, 241, 0.06);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.04);
        }
        .msg.timeout {
            display: block;
            background: rgba(251, 191, 36, 0.06);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.04);
        }

        /* ===== الواجهة الرئيسية ===== */
        .dashboard {
            display: none;
        }
        .dashboard.active {
            display: block;
            animation: fadeUp 0.4s ease;
        }

        .hero {
            text-align: center;
            padding: 50px 30px;
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .hero i {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 16px;
            transition: color 0.3s ease;
        }
        .hero h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .hero p {
            color: rgba(255, 255, 255, 0.25);
            font-size: 1rem;
        }

        /* ===== لوحة الإدارة ===== */
        .admin-panel {
            display: none;
            margin-top: 24px;
        }
        .admin-panel.active {
            display: block;
            animation: fadeUp 0.3s ease;
        }

        .admin-sidebar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 8px;
            border: 1px solid var(--border);
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .admin-tab {
            padding: 10px 20px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
        }
        .admin-tab.active {
            background: rgba(99, 102, 241, 0.1);
            color: #a5b4fc;
        }
        .admin-tab:hover:not(.active) {
            color: rgba(255, 255, 255, 0.5);
        }

        .admin-content {
            display: none;
        }
        .admin-content.active {
            display: block;
            animation: fadeUp 0.3s ease;
        }

        /* ===== بطاقات الإحصائيات ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .stat-card .label {
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .stat-card .value {
            font-size: 1.8rem;
            font-weight: 800;
            margin-top: 4px;
        }

        /* ===== جداول ===== */
        .table-wrap {
            overflow-x: auto;
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 4px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th {
            text-align: right;
            padding: 12px 16px;
            color: rgba(255, 255, 255, 0.15);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 10px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.5);
        }

        .btn-sm {
            padding: 4px 12px;
            border: none;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all var(--transition);
            min-height: 28px;
        }
        .btn-sm.primary {
            background: rgba(99, 102, 241, 0.08);
            color: #a5b4fc;
        }
        .btn-sm.primary:hover {
            background: rgba(99, 102, 241, 0.15);
        }
        .btn-sm.danger {
            background: rgba(239, 68, 68, 0.06);
            color: #f87171;
        }
        .btn-sm.danger:hover {
            background: rgba(239, 68, 68, 0.12);
        }
        .btn-sm.success {
            background: rgba(52, 211, 153, 0.06);
            color: #34d399;
        }
        .btn-sm.success:hover {
            background: rgba(52, 211, 153, 0.12);
        }

        /* ===== إعدادات الموقع ===== */
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }
        .setting-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .setting-item .label {
            font-size: 0.8rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.3);
        }
        .setting-item input,
        .setting-item select {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 12px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            min-width: 100px;
            min-height: 36px;
            transition: border-color 0.3s ease;
        }
        .setting-item input[type="color"] {
            width: 40px;
            height: 36px;
            padding: 2px;
            cursor: pointer;
            min-width: unset;
        }
        .setting-item .save-color-btn {
            padding: 4px 12px;
            border: none;
            border-radius: 6px;
            background: rgba(99, 102, 241, 0.08);
            color: #a5b4fc;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            min-height: 28px;
        }
        .setting-item .save-color-btn:hover {
            background: rgba(99, 102, 241, 0.15);
        }
        .setting-item .save-color-btn.saved {
            background: rgba(52, 211, 153, 0.08);
            color: #34d399;
        }
        .setting-item .toggle-switch {
            position: relative;
            width: 48px;
            height: 26px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        .setting-item .toggle-switch.active {
            background: var(--primary);
        }
        .setting-item .toggle-switch .slider {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        .setting-item .toggle-switch.active .slider {
            right: 25px;
        }

        /* ===== سجلات ===== */
        .log-entry {
            padding: 8px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.01);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.2);
        }
        .log-entry .time {
            color: rgba(255, 255, 255, 0.05);
            font-size: 0.7rem;
        }
        .log-entry .user {
            color: #a5b4fc;
            font-weight: 500;
        }

        /* ===== نافذة منبثقة ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-box {
            background: var(--card-bg);
            border: 1px solid var(--border);

        .payment-setting-card .header .status.inactive {

<body>

    <script>
        // =============================================
        // ===== الإعدادات =====
        // =============================================
        const API = window.location.origin;
        const REQUEST_TIMEOUT = 60000;
        let token = localStorage.getItem('token');
        let currentUser = null;
        let currentSettings = {};
        let selectedDepositMethod = null;

        // =============================================
        // ===== دوال الاتصال مع مهلة =====
        // =============================================
        function showConnectionStatus(message, type = 'connecting') {
            const el = document.getElementById('connectionStatus');
            el.textContent = message;
            el.className = `connection-status show ${type}`;
            clearTimeout(el._timeout);
            if (type !== 'connecting') {
                el._timeout = setTimeout(() => {
                    el.classList.remove('show');
                }, 5000);
            }
        }

        function hideConnectionStatus() {
            const el = document.getElementById('connectionStatus');
            el.classList.remove('show');
        }

        async function fetchWithTimeout(url, options = {}, timeout = REQUEST_TIMEOUT) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeout);

            try {
                showConnectionStatus('⏳ جاري الاتصال بالخادم...', 'connecting');
                const response = await fetch(url, {
                    ...options,
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                hideConnectionStatus();

                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('text/html')) {
                    throw new Error('الخادم أعاد HTML بدلاً من JSON. تأكد من أن الخادم يعمل بشكل صحيح.');
                }

                return response;
            } catch (error) {
                clearTimeout(timeoutId);
                if (error.name === 'AbortError') {
                    showConnectionStatus('⏰ انتهت مهلة الانتظار (60 ثانية)، يرجى المحاولة مرة أخرى', 'error');
                    throw new Error('انتهت مهلة الانتظار، يرجى المحاولة مرة أخرى');
                }
                showConnectionStatus('❌ لا يمكن الاتصال بالخادم: ' + error.message, 'error');
                throw error;
            }
        }

        async function apiFetch(endpoint, options = {}) {
            const res = await fetchWithTimeout(`${API}${endpoint}`, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    ...options.headers
                }
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'خطأ');
            return data;
        }

        // =============================================
        // ===== تحديث اسم الموقع =====
        // =============================================
        function updateSiteName(siteName) {
            if (!siteName) return;
            document.title = siteName;
            const brandContainer = document.getElementById('brandName');
            if (brandContainer) {
                const chars = siteName.split('');
                const spans = brandContainer.querySelectorAll('span');
                spans.forEach(span => span.style.display = 'none');
                chars.forEach((char, index) => {
                    if (index < spans.length) {
                        spans[index].style.display = 'inline-block';
                        spans[index].textContent = char;
                    } else {
                        const newSpan = document.createElement('span');
                        newSpan.textContent = char;
                        newSpan.style.display = 'inline-block';
                        brandContainer.appendChild(newSpan);
                    }
                });
            }
            localStorage.setItem('siteName', siteName);
        }

        // =============================================
        // ===== تطبيق الألوان العالمية =====
        // =============================================
        function applyGlobalColors(settings) {
            const colorMap = {
                'primary_color': '--primary',
                'secondary_color': '--secondary',
                'accent_color': '--accent',
                'bg_color': '--bg',
                'text_color': '--text',
                'card_bg': '--card-bg',
                'border_color': '--border',
                'glow_color': '--glow'
            };

            for (const [key, cssVar] of Object.entries(colorMap)) {
                if (settings[key]) {
                    document.documentElement.style.setProperty(cssVar, settings[key]);
                }
            }

            if (settings.bg_color) {
                document.body.style.background = settings.bg_color;
            }

            const orbs = document.querySelectorAll('.bg-orb');
            if (orbs.length >= 3) {
                if (settings.primary_color) orbs[0].style.background = settings.primary_color;
                if (settings.secondary_color) orbs[1].style.background = settings.secondary_color;
                if (settings.accent_color) orbs[2].style.background = settings.accent_color;
            }

            if (settings.site_name) {
                updateSiteName(settings.site_name);
            }

            currentSettings = settings;
        }

        async function submitDeposit() {
            if (!selectedDepositMethod) {
                showConnectionStatus('❌ يرجى اختيار طريقة الدفع أولاً', 'error');
                return;
            }

            const txid = document.getElementById('depositTxid').value.trim();
            const amount = parseFloat(document.getElementById('depositAmount').value);

            if (!txid || txid.length < 5) {
                showConnectionStatus('❌ يرجى إدخال رقم عملية صحيح', 'error');
                return;
            }

            if (!amount || amount <= 0) {
                showConnectionStatus('❌ يرجى إدخال مبلغ صحيح', 'error');
                return;
            }

            const btn = document.getElementById('depositSubmitBtn');
            const resultEl = document.getElementById('depositResult');
            const originalText = btn.textContent;

            try {
                btn.disabled = true;
                btn.textContent = '⏳ جاري المعالجة...';
                resultEl.style.display = 'block';
                resultEl.innerHTML = '<span style="color:#a5b4fc;">⏳ جاري التحقق من العملية...</span>';

                const result = await apiFetch('/api/payment/deposit', {
                    method: 'POST',
                    body: JSON.stringify({
                        method: selectedDepositMethod,
                        txid: txid,
                        amount: amount
                    })
                });

                if (result.success) {
                    resultEl.innerHTML = `
                        <div style="color:#34d399;padding:10px;background:rgba(52,211,153,0.05);border-radius:8px;">
                            ✅ تم الإيداع بنجاح!<br>
                            <span style="font-size:0.9rem;">المبلغ المضاف: <strong>${result.final_amount}</strong> SYP</span>
                            ${result.bonus_amount > 0 ? `<br><span style="font-size:0.8rem;color:#fbbf24;">🎁 بونص: +${result.bonus_amount} SYP</span>` : ''}
                        </div>
                    `;

                    if (currentUser) {
                        currentUser.balance = result.new_balance;
                        localStorage.setItem('user', JSON.stringify(currentUser));
                        updateNavbar(currentUser);
                    }

                    setTimeout(() => {
                        closeModal('depositModal');
                    }, 3000);
                } else {
                    resultEl.innerHTML = `
                        <div style="color:#f87171;padding:10px;background:rgba(239,68,68,0.05);border-radius:8px;">
                            ❌ ${result.message || 'فشل الإيداع'}
                        </div>
                    `;
                }

            } catch (e) {
                resultEl.innerHTML = `
                    <div style="color:#f87171;padding:10px;background:rgba(239,68,68,0.05);border-radius:8px;">
                        ❌ خطأ: ${e.message}
                    </div>
                `;
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }

        async function submitWithdraw() {
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const method = document.getElementById('withdrawMethod').value;
            const account = document.getElementById('withdrawAccount').value.trim();

            if (!amount || amount <= 0) {
                showConnectionStatus('❌ يرجى إدخال مبلغ صحيح', 'error');
                return;
            }

            if (amount > (currentUser.balance || 0)) {
                showConnectionStatus('❌ الرصيد غير كافٍ', 'error');
                return;
            }

            if (!account) {
                showConnectionStatus('❌ يرجى إدخال رقم الحساب أو المحفظة', 'error');

            const btn = document.getElementById('withdrawSubmitBtn');
            const resultEl = document.getElementById('withdrawResult');
            const originalText = btn.textContent;

            try {
                btn.disabled = true;
                btn.textContent = '⏳ جاري...';
                resultEl.style.display = 'block';
                resultEl.innerHTML = '<span style="color:#a5b4fc;">⏳ جاري معالجة طلب السحب...</span>';

                // محاكاة طلب السحب (سيتم ربطها بالـ API لاحقاً)

        async function saveTextSetting(key, value) {
            const btn = event.target.closest('.save-color-btn');
            const originalText = btn.innerHTML;

            try {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                btn.disabled = true;

                const result = await apiFetch('/api/admin/settings', {
                    method: 'POST',
                    body: JSON.stringify({ key, value })
                });

                if (result.settings) {

        // ===== إعدادات المكافأة =====
        async function loadBonusSettings() {
            try {
                const settings = await apiFetch('/api/admin/settings');
                const container = document.getElementById('bonusSettings');

                const labels = {
                    bonus_enabled: 'تفعيل المكافأة',
                    bonus_amount: 'قيمة المكافأة',
                    bonus_start_date: 'تاريخ البداية',
                    bonus_end_date: 'تاريخ النهاية'
                };

                container.innerHTML = Object.entries(settings).filter(([k]) =>
                    ['bonus_enabled', 'bonus_amount', 'bonus_start_date', 'bonus_end_date'].includes(k)
                ).map(([k, v]) => {
                    let input = '';
                    if (k === 'bonus_enabled') {
                        input = `
                            <div class="toggle-switch ${v === 'true' ? 'active' : ''}" onclick="toggleSetting('${k}', this)">
                                <div class="slider"></div>
                            </div>
                        `;
                    } else if (k === 'bonus_amount') {
                        input = `
                            <div style="display:flex;align-items:center;gap:8px;">
                                <input type="number" value="${v}" id="bonus_${k}" style="min-width:80px;" />
                                <button class="save-color-btn" onclick="saveBonusSetting('${k}', document.getElementById('bonus_${k}').value)">
                                    <i class="fas fa-check"></i> حفظ
                                </button>
                            </div>
                        `;
                    } else {
                        const dateVal = v ? v.split('T')[0] : '';
                        input = `
                            <div style="display:flex;align-items:center;gap:8px;">
                                <input type="datetime-local" value="${dateVal}" id="bonus_${k}" style="min-width:140px;" />
                                <button class="save-color-btn" onclick="saveBonusSetting('${k}', document.getElementById('bonus_${k}').value)">
                                    <i class="fas fa-check"></i> حفظ
                                </button>
                            </div>
                        `;
                    }
                    return `<div class="setting-item"><span class="label">${labels[k] || k}</span>${input}</div>`;
                }).join('');
            } catch (e) {
                console.error('خطأ في تحميل إعدادات المكافأة:', e);
            }
        }

        // =============================================
        // ===== إعدادات الدفع للإدارة =====

        async function loadPaymentAdminSettings() {
            try {
                const res = await fetchWithTimeout(`${API}/api/payment/settings`);
                const settings = await res.json();

                const container = document.getElementById('paymentSettingsContainer');
                const methodNames = {
                    shamcash_usd: { name: 'شام كاش (دولار)', icon: '💳' },
                    shamcash_syp: { name: 'شام كاش (ليرة)', icon: '💳' },
                    syriatel: { name: 'سيرياتيل كاش', icon: '📱' }
                };

                let html = '';
                for (const [key, value] of Object.entries(settings)) {
                    const info = methodNames[key] || { name: key, icon: '💳' };
                    const isEnabled = value.enabled || false;

                    html += `
                        <div class="payment-setting-card">
                            <div class="header">
                                <div>
                                    <span class="title">${info.icon} ${info.name}</span>
                                    <span class="status ${isEnabled ? 'active' : 'inactive'}">
                                        ${isEnabled ? '✅ مفعل' : '❌ معطل'}
                                    </span>
                                </div>
                                <div class="toggle-switch ${isEnabled ? 'active' : ''}" 
                                     onclick="togglePaymentMethod('${key}', this)">
                                    <div class="slider"></div>
                                </div>
                            </div>
                            
                            <div class="payment-setting-grid">
                                <div class="field">
                                    <label>الحد الأدنى</label>
                                    <input type="number" value="${value.min_amount || 0}" 
                                           id="pm_${key}_min_amount" />
                                </div>
                                <div class="field">
                                    <label>الحد الأقصى</label>
                                    <input type="number" value="${value.max_amount || 0}" 
                                           id="pm_${key}_max_amount" />
                                </div>
                                <div class="field">
                                    <label>سعر الصرف</label>
                                    <input type="number" step="0.0001" value="${value.exchange_rate || 1}" 
                                           id="pm_${key}_exchange_rate" />
                                </div>
                                <div class="field">
                                    <label>نسبة البونص (%)</label>
                                    <input type="number" step="0.1" value="${value.bonus_percent || 0}" 
                                           id="pm_${key}_bonus_percent" />
                                </div>
                                ${key === 'shamcash_usd' || key === 'shamcash_syp' ? `
                                <div class="field">
                                    <label>مفتاح API</label>
                                    <input type="text" value="${value.api_key || ''}" 
                                           id="pm_${key}_api_key" placeholder="أدخل مفتاح API" />
                                </div>
                                <div class="field">
                                    <label>عنوان المحفظة</label>
                                    <input type="text" value="${value.account_address || ''}" 
                                           id="pm_${key}_account_address" placeholder="أدخل عنوان المحفظة" />
                                </div>
                                ` : ''}
                                ${key === 'syriatel' ? `
                                <div class="field full-width">
                                    <label>أرقام GSM (مفصولة بفاصلة)</label>
                                    <input type="text" value="${Array.isArray(value.gsm_numbers) ? value.gsm_numbers.join(', ') : ''}" 
                                           id="pm_${key}_gsm_numbers" placeholder="0999999999, 0988888888" />
                                </div>
                                <div class="field full-width">
                                    <label>مفتاح API</label>
                                    <input type="text" value="${value.api_key || ''}" 
                                           id="pm_${key}_api_key" placeholder="أدخل مفتاح API" />
                                </div>
                                ` : ''}
                            </div>
                            
                            <button class="btn-sm primary" onclick="savePaymentSettings('${key}')" 
                                    style="margin-top:10px;width:100%;justify-content:center;padding:8px;">
                                <i class="fas fa-save"></i> حفظ إعدادات ${info.name}
                            </button>
                        </div>

        // ===== تبديل حالة طريقة الدفع =====
        async function togglePaymentMethod(method, element) {
            const isActive = element.classList.contains('active');
            const newValue = isActive ? 'false' : 'true';

            try {
                await apiFetch('/api/payment/settings', {
                    method: 'POST',
                    body: JSON.stringify({ method, key: 'enabled', value: newValue })
                });

                element.classList.toggle('active');
                showConnectionStatus(`✅ تم ${newValue === 'true' ? 'تفعيل' : 'تعطيل'} ${method}`, 'success');

                setTimeout(() => loadPaymentAdminSettings(), 500);
            } catch (e) {
                alert('❌ خطأ في تغيير حالة الطريقة: ' + e.message);
            }
        }

        // ===== حفظ إعدادات طريقة الدفع =====
        async function savePaymentSettings(method) {
            const fields = [
                'min_amount',
                'max_amount',
                'exchange_rate',
                'bonus_percent',
                'api_key',
                'account_address',
                'gsm_numbers'
            ];

            const data = {};

            for (const field of fields) {
                const el = document.getElementById(`pm_${method}_${field}`);
                if (el) {
                    let value = el.value.trim();

                    if (['min_amount', 'max_amount', 'exchange_rate', 'bonus_percent'].includes(field)) {
                        value = parseFloat(value) || 0;
                    }

                    if (field === 'gsm_numbers') {
                        value = value.split(',').map(s => s.trim()).filter(s => s);
                    }

                    data[field] = value;
                }
            }

            if (data.min_amount < 0) {
                showConnectionStatus('❌ الحد الأدنى يجب أن يكون أكبر من صفر', 'error');
                return;
            }
            if (data.max_amount < data.min_amount) {
                showConnectionStatus('❌ الحد الأقصى يجب أن يكون أكبر من الحد الأدنى', 'error');
                return;
            }

            const btn = event.target;
            const originalText = btn.innerHTML;

            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';

                for (const [key, value] of Object.entries(data)) {
                    await apiFetch('/api/payment/settings', {
                        method: 'POST',
                        body: JSON.stringify({ method, key, value })
                    });
                }

                showConnectionStatus(`✅ تم حفظ إعدادات ${method} بنجاح`, 'success');

                btn.innerHTML = '<i class="fas fa-check"></i> تم الحفظ';
                btn.classList.add('saved');
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('saved');
                    btn.disabled = false;
                }, 2000);

            } catch (e) {
                showConnectionStatus(`❌ خطأ في حفظ الإعدادات: ${e.message}`, 'error');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

            try {
                await apiFetch('/api/admin/toggle-user', {
                    method: 'POST',
                    body: JSON.stringify({ username, active })
                });

            } catch (e) { alert('❌ خطأ: ' + e.message); }

            if (!confirm(`حذف المستخدم ${username}؟`)) return;
            try {
                await apiFetch('/api/admin/delete-user', {
                    method: 'DELETE',
                    body: JSON.stringify({ username })
                });
                loadUsers();
                loadStats();

        // =============================================
        // ===== التبويبات =====
        // =============================================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const tab = btn.dataset.tab;
                document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
                document.getElementById(tab === 'login' ? 'loginForm' : 'registerForm').classList.add('active');
                document.querySelectorAll('.msg').forEach(m => { m.className = 'msg';
                    m.textContent = ''; });
            };
        });

        document.querySelectorAll('.admin-tab').forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const target = tab.dataset.tab;
                document.querySelectorAll('.admin-content').forEach(c => c.classList.remove('active'));
                document.getElementById(`admin-${target}`).classList.add('active');

                if (target === 'payment') {
                    loadPaymentAdminSettings();
                }
            };
        });

        // =============================================
        // ===== إظهار/إخفاء لوحة الإدارة =====
        // =============================================
        function toggleAdminPanel() {
            adminVisible = !adminVisible;
            const panel = document.getElementById('adminPanel');
            panel.classList.toggle('active', adminVisible);
            const btn = document.getElementById('adminToggle');
            if (adminVisible) {
                btn.innerHTML = '<i class="fas fa-crown"></i> <span>إخفاء</span>';
                loadAdminData();
            } else {
                btn.innerHTML = '<i class="fas fa-crown"></i> <span>لوحة</span>';
            }
        }

        // =============================================
        // ===== Enter =====
        // =============================================
        document.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const form = inp.closest('.form');
                    if (form?.id === 'loginForm') document.getElementById('loginBtn').click();
                    else if (form?.id === 'registerForm') document.getElementById('registerBtn').click();
                    else if (inp.id === 'depositTxid' || inp.id === 'depositAmount') {
                        document.getElementById('depositSubmitBtn').click();
                    } else if (inp.id === 'withdrawAmount' || inp.id === 'withdrawAccount') {
                        document.getElementById('withdrawSubmitBtn').click();
                    }
                }
            });
        });

        // =============================================
        // ===== التهيئة =====
        // =============================================
        async function init() {
            await loadGlobalSettings();

            const savedSiteName = localStorage.getItem('siteName');
            if (savedSiteName) {
                updateSiteName(savedSiteName);
            }

            const userData = localStorage.getItem('user');
            if (userData) {
                try {
                    currentUser = JSON.parse(userData);
                    if (currentUser.username) {
                        token = localStorage.getItem('token');
                        document.getElementById('authPage').style.display = 'none';
                        document.getElementById('dashboardPage').classList.add('active');
                        document.getElementById('actionBar').classList.add('active');
                        document.getElementById('app').classList.add('with-action-bar');
                        updateNavbar(currentUser);
                        document.getElementById('welcomeText').textContent = `مرحباً ${currentUser.username}`;
                        document.getElementById('userRole').textContent = currentUser.role === 'admin' ? '👑 مدير النظام' :
                            'مستخدم';

                        if (currentUser.role === 'admin') {
                            document.getElementById('adminPanel').classList.add('active');
                            adminVisible = true;
                            loadAdminData();
                            document.getElementById('adminToggle').innerHTML = '<i class="fas fa-crown"></i> <span>إخفاء</span>';
                        }
                    }
                } catch (_) {
                    localStorage.clear();
                }
            }

            try {
                await fetchWithTimeout(`${API}/api/health`);
                showConnectionStatus('✅ الخادم متصل', 'success');
            } catch (e) {
                showConnectionStatus('⚠️ لا يمكن الاتصال بالخادم', 'error');
            }
        }

        init();
    </script>
