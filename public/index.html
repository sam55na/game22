<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Wars</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0a0a1a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== الشريط العلوي ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(10, 10, 26, 0.92);
            backdrop-filter: blur(16px);
            padding: 10px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.15rem;
            font-weight: 800;
        }

        .brand i {
            font-size: 1.3rem;
            color: #6366f1;
        }

        .brand .letters {
            display: flex;
            gap: 1px;
        }

        .brand .letters span {
            display: inline-block;
            animation: fall 4.5s ease-in-out infinite;
            animation-delay: calc(var(--i) * 0.12s);
            font-weight: 800;
        }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(160deg); opacity: 0; }
            12% { transform: translateY(0) rotate(0); opacity: 1; }
            82% { transform: translateY(0) rotate(0); opacity: 1; }
            100% { transform: translateY(30px) rotate(-12deg); opacity: 0; }
        }

        .brand .letters span:nth-child(1) { --i: 0; }
        .brand .letters span:nth-child(2) { --i: 1; }
        .brand .letters span:nth-child(3) { --i: 2; }
        .brand .letters span:nth-child(4) { --i: 3; }
        .brand .letters span:nth-child(5) { --i: 4; }
        .brand .letters span:nth-child(6) { --i: 5; }
        .brand .letters span:nth-child(7) { --i: 6; }
        .brand .letters span:nth-child(8) { --i: 7; }
        .brand .letters span:nth-child(9) { --i: 8; }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn {
            padding: 7px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5, #0891b2);
            color: #fff;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(79,70,229,0.25); }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.6);
        }
        .btn-outline:hover { background: rgba(255,255,255,0.04); color: #fff; }

        .btn-danger {
            background: rgba(239,68,68,0.1);
            color: #f87171;
            border: 1px solid rgba(239,68,68,0.08);
        }
        .btn-danger:hover { background: rgba(239,68,68,0.18); }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f46e5, #0891b2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* ===== المحتوى ===== */
        .main {
            margin-top: 70px;
            padding: 28px 32px;
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
            flex: 1;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.08);
        }

        .empty-state i {
            font-size: 3.2rem;
            display: block;
            margin-bottom: 14px;
        }
        .empty-state h2 {
            color: rgba(255,255,255,0.15);
            font-weight: 700;
            font-size: 1.3rem;
        }
        .empty-state p {
            color: rgba(255,255,255,0.06);
            font-size: 0.85rem;
            margin-top: 6px;
        }

        /* ===== نموذج المصادقة ===== */
        .auth-box {
            max-width: 380px;
            margin: 20px auto;
            background: rgba(255,255,255,0.02);
            border-radius: 28px;
            padding: 28px 24px;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .tabs {
            display: flex;
            gap: 4px;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 22px;
        }

        .tab-btn {
            flex: 1;
            padding: 9px;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.25);
            font-weight: 600;
            font-size: 0.8rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .tab-btn.active {
            background: rgba(79,70,229,0.15);
            color: #a5b4fc;
        }
        .tab-btn:hover:not(.active) { color: rgba(255,255,255,0.5); }

        .form { display: none; }
        .form.active { display: block; animation: fadeUp 0.3s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            color: rgba(255,255,255,0.25);
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 5px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.08);
            font-size: 0.85rem;
        }

        .input-wrap input {
            width: 100%;
            padding: 11px 40px 11px 14px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-wrap input:focus {
            border-color: rgba(79,70,229,0.3);
            background: rgba(255,255,255,0.05);
        }
        .input-wrap input::placeholder { color: rgba(255,255,255,0.06); }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #4f46e5, #0891b2);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
            margin-top: 4px;
        }

        .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(79,70,229,0.2); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        .msg {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            display: none;
            text-align: center;
        }

        .msg.error { display: block; background: rgba(239,68,68,0.06); color: #f87171; border: 1px solid rgba(239,68,68,0.06); }
        .msg.success { display: block; background: rgba(52,211,153,0.06); color: #34d399; border: 1px solid rgba(52,211,153,0.06); }

        /* ===== استجابة ===== */
        @media (max-width: 700px) {
            .navbar { padding: 8px 16px; height: 52px; }
            .brand { font-size: 1rem; }
            .brand .letters span { font-size: 0.9rem; }
            .main { padding: 16px; margin-top: 60px; }
            .auth-box { margin: 10px; padding: 20px 16px; border-radius: 20px; }
            .btn span { display: none; }
            .nav-actions { gap: 8px; }
        }

        @media (max-width: 420px) {
            .brand { font-size: 0.85rem; gap: 8px; }
            .brand .letters span { font-size: 0.75rem; }
            .btn { padding: 5px 12px; font-size: 0.7rem; }
            .avatar { width: 28px; height: 28px; font-size: 0.7rem; }
            .auth-box { padding: 16px 12px; border-radius: 16px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">
            <i class="fas fa-gamepad"></i>
            <div class="letters">
                <span>G</span><span>a</span><span>m</span><span>e</span>
                <span style="margin-right:2px;"></span>
                <span>W</span><span>a</span><span>r</span><span>s</span>
            </div>
        </div>
        <div class="nav-actions" id="navActions"></div>
    </nav>

    <div class="main">
        <div class="empty-state" id="emptyState">
            <i class="fas fa-gamepad"></i>
            <h2>Game Wars</h2>
            <p>سجل الدخول لبدء التجربة</p>
        </div>

        <div class="auth-box" id="authBox">
            <div class="tabs">
                <button class="tab-btn active" data-tab="login"><i class="fas fa-sign-in-alt"></i> دخول</button>
                <button class="tab-btn" data-tab="register"><i class="fas fa-user-plus"></i> حساب</button>
            </div>

            <div class="form active" id="loginForm">
                <div class="input-group">
                    <label>اسم المستخدم</label>
                    <div class="input-wrap">
                        <i class="fas fa-user"></i>
                        <input type="text" id="loginUsername" placeholder="أدخل اسم المستخدم" />
                    </div>
                </div>
                <div class="input-group">
                    <label>كلمة المرور</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور" />
                    </div>
                </div>
                <button class="submit-btn" id="loginBtn">دخول</button>
                <div class="msg" id="loginMsg"></div>
            </div>

            <div class="form" id="registerForm">
                <div class="input-group">
                    <label>اسم المستخدم</label>
                    <div class="input-wrap">
                        <i class="fas fa-user"></i>
                        <input type="text" id="registerUsername" placeholder="3 أحرف على الأقل" />
                    </div>
                </div>
                <div class="input-group">
                    <label>كلمة المرور</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="registerPassword" placeholder="8 أحرف على الأقل" />
                    </div>
                </div>
                <button class="submit-btn" id="registerBtn">إنشاء حساب</button>
                <div class="msg" id="registerMsg"></div>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.hostname === 'localhost' ? 'http://localhost:3000' : 'https://game22-hoas.onrender.com';

        function showMsg(el, text, type = 'error') {
            el.textContent = text;
            el.className = `msg ${type}`;
        }

        function setLoading(btn, loading) {
            btn.disabled = loading;
            btn.textContent = loading ? 'جاري...' : btn.dataset.original;
        }

        document.querySelectorAll('.submit-btn').forEach(b => b.dataset.original = b.textContent);

        // ===== تحديث الشريط =====
        function updateNavbar(user) {
            const nav = document.getElementById('navActions');
            if (user) {
                nav.innerHTML = `
                    <div class="avatar">${user.username.charAt(0)}</div>
                    <button class="btn btn-danger" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> <span>خروج</span></button>
                `;
                document.getElementById('logoutBtn').onclick = () => { localStorage.clear(); location.reload(); };
                document.getElementById('authBox').style.display = 'none';
                document.getElementById('emptyState').innerHTML = `
                    <i class="fas fa-gamepad"></i>
                    <h2>مرحباً ${user.username}</h2>
                    <p style="color:rgba(255,255,255,0.06);">أنت مسجل الدخول</p>
                `;
            } else {
                nav.innerHTML = `<button class="btn btn-primary" id="showLogin"><i class="fas fa-sign-in-alt"></i> <span>دخول</span></button>`;
                document.getElementById('showLogin').onclick = () => {
                    document.getElementById('authBox').scrollIntoView({ behavior: 'smooth' });
                };
                document.getElementById('authBox').style.display = 'block';
                document.getElementById('emptyState').innerHTML = `
                    <i class="fas fa-gamepad"></i>
                    <h2>Game Wars</h2>
                    <p style="color:rgba(255,255,255,0.06);">سجل الدخول لبدء التجربة</p>
                `;
            }
        }

        // ===== تسجيل الدخول =====
        document.getElementById('loginBtn').onclick = async () => {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const msg = document.getElementById('loginMsg');
            const btn = document.getElementById('loginBtn');

            if (!username || !password) return showMsg(msg, 'املأ جميع الحقول');

            setLoading(btn, true);
            try {
                const res = await fetch(`${API}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                showMsg(msg, '✅ تم الدخول', 'success');
                setTimeout(() => updateNavbar(data.user), 300);
            } catch (e) {
                showMsg(msg, '❌ ' + e.message);
            } finally {
                setLoading(btn, false);
            }
        };

        // ===== إنشاء حساب =====
        document.getElementById('registerBtn').onclick = async () => {
            const username = document.getElementById('registerUsername').value.trim();
            const password = document.getElementById('registerPassword').value.trim();
            const msg = document.getElementById('registerMsg');
            const btn = document.getElementById('registerBtn');

            if (!username || !password) return showMsg(msg, 'املأ جميع الحقول');
            if (username.length < 3) return showMsg(msg, 'اسم المستخدم 3 أحرف على الأقل');
            if (password.length < 8) return showMsg(msg, 'كلمة المرور 8 أحرف على الأقل');

            setLoading(btn, true);
            try {
                const res = await fetch(`${API}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                showMsg(msg, '✅ تم إنشاء الحساب', 'success');
                document.getElementById('registerUsername').value = '';
                document.getElementById('registerPassword').value = '';
                setTimeout(() => document.querySelector('[data-tab="login"]').click(), 500);
            } catch (e) {
                showMsg(msg, '❌ ' + e.message);
            } finally {
                setLoading(btn, false);
            }
        };

        // ===== التبويبات =====
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const tab = btn.dataset.tab;
                document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
                document.getElementById(tab === 'login' ? 'loginForm' : 'registerForm').classList.add('active');
                document.querySelectorAll('.msg').forEach(m => { m.className = 'msg'; m.textContent = ''; });
            };
        });

        // ===== Enter =====
        document.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const form = inp.closest('.form');
                    if (form.id === 'loginForm') document.getElementById('loginBtn').click();
                    else document.getElementById('registerBtn').click();
                }
            });
        });

        // ===== استعادة الجلسة =====
        (function() {
            const userData = localStorage.getItem('user');
            if (userData) {
                try {
                    const user = JSON.parse(userData);
                    if (user.username) updateNavbar(user);
                } catch (_) { localStorage.clear(); }
            } else {
                updateNavbar(null);
            }
        })();
    </script>
</body>
</html>
