<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>LuxWeb - منصة احترافية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: #0b0b1a;
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(6, 182, 212, 0.12) 0%, transparent 50%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* خلفية متحركة متطورة */
        .bg-particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-particles span {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* الحاوية الرئيسية */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 40px;
            padding: 40px 35px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.02);
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* الهيدر */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            border-radius: 24px;
            font-size: 32px;
            color: white;
            margin-bottom: 16px;
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.3);
            transition: transform 0.3s ease;
        }

        .logo-icon:hover {
            transform: rotate(-5deg) scale(1.02);
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 900;
            color: white;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.85rem;
            margin-top: 4px;
            font-weight: 400;
        }

        /* التبويبات */
        .tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 4px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn i {
            font-size: 0.9rem;
        }

        .tab-btn.active {
            background: rgba(99, 102, 241, 0.25);
            color: white;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.15);
        }

        .tab-btn:hover:not(.active) {
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.03);
        }

        /* النماذج */
        .form {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .form.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 1rem;
            transition: color 0.3s ease;
        }

        .form-group .input-wrapper:focus-within i {
            color: #818cf8;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px 14px 44px;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            color: white;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #6366f1;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }

        /* زر الإرسال */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
            font-family: inherit;
        }

        .submit-btn i {
            font-size: 1rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 40px rgba(99, 102, 241, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* الرسائل */
        .message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
            display: none;
        }

        .message.error {
            display: block;
            background: rgba(239, 68, 68, 0.08);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.12);
        }

        .message.success {
            display: block;
            background: rgba(52, 211, 153, 0.08);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.12);
        }

        /* لوحة التحكم */
        #dashboard {
            display: none;
        }

        #dashboard.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .site-title {
            font-size: 1.4rem;
            font-weight: 900;
            background: linear-gradient(90deg, #818cf8, #06b6d4, #818cf8);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmerText 4s linear infinite;
        }

        @keyframes shimmerText {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .site-title span {
            display: inline-block;
            animation: floatLetters 3s ease-in-out infinite;
            animation-delay: calc(var(--i) * 0.08s);
        }

        @keyframes floatLetters {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .balance-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(99, 102, 241, 0.12);
            padding: 8px 18px 8px 14px;
            border-radius: 14px;
            border: 1px solid rgba(99, 102, 241, 0.15);
        }

        .balance-box i {
            font-size: 1.2rem;
            color: #fbbf24;
        }

        .balance-box .amount {
            font-size: 1.2rem;
            font-weight: 800;
            color: white;
            font-feature-settings: "tnum";
        }

        .balance-box .label {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .dashboard-content {
            text-align: center;
            padding: 20px 0 8px;
        }

        .dashboard-content .greeting {
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
            margin-bottom: 4px;
        }

        .dashboard-content .greeting span {
            color: #818cf8;
        }

        .dashboard-content .sub-text {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .logout-btn {
            padding: 10px 28px;
            background: rgba(239, 68, 68, 0.08);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.12);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.15);
            transform: scale(1.02);
        }

        .logout-btn i {
            font-size: 0.9rem;
        }

        /* تذييل */
        .footer {
            text-align: center;
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.06);
            font-size: 0.65rem;
            letter-spacing: 1px;
        }

        /* استجابة */
        @media (max-width: 520px) {
            .container { padding: 28px 18px; }
            .header h1 { font-size: 1.6rem; }
            .logo-icon { width: 60px; height: 60px; font-size: 28px; }
            .navbar { flex-direction: column; align-items: stretch; text-align: center; }
            .balance-box { justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="bg-particles" id="particles"></div>

    <div class="container">
        <!-- الهيدر -->
        <div class="header">
            <div class="logo-icon"><i class="fas fa-crown"></i></div>
            <h1>LuxWeb</h1>
            <p>منصة متطورة بتقنيات المستقبل</p>
        </div>

        <!-- قسم المصادقة -->
        <div id="authSection">
            <div class="tabs">
                <button class="tab-btn active" data-tab="login"><i class="fas fa-sign-in-alt"></i> تسجيل دخول</button>
                <button class="tab-btn" data-tab="register"><i class="fas fa-user-plus"></i> إنشاء حساب</button>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <div class="form active" id="loginForm">
                <div class="form-group">
                    <label><i class="fas fa-user" style="margin-left:6px;"></i> اسم المستخدم</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="loginUsername" placeholder="أدخل اسم المستخدم" autocomplete="username" />
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock" style="margin-left:6px;"></i> كلمة المرور</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور" autocomplete="current-password" />
                    </div>
                </div>
                <button class="submit-btn" id="loginBtn"><i class="fas fa-arrow-right"></i> تسجيل الدخول</button>
                <div class="message" id="loginMessage"></div>
            </div>

            <!-- نموذج إنشاء حساب -->
            <div class="form" id="registerForm">
                <div class="form-group">
                    <label><i class="fas fa-user" style="margin-left:6px;"></i> اسم المستخدم</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="registerUsername" placeholder="3 أحرف على الأقل" autocomplete="username" />
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock" style="margin-left:6px;"></i> كلمة المرور</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="registerPassword" placeholder="6 أحرف على الأقل" autocomplete="new-password" />
                    </div>
                </div>
                <button class="submit-btn" id="registerBtn"><i class="fas fa-sparkles"></i> إنشاء حساب</button>
                <div class="message" id="registerMessage"></div>
            </div>
        </div>

        <!-- لوحة التحكم -->
        <div id="dashboard">
            <div class="navbar">
                <div class="site-title" id="siteTitle"></div>
                <div class="balance-box">
                    <i class="fas fa-coins"></i>
                    <div>
                        <div class="label">الرصيد</div>
                        <div class="amount" id="userBalance">0</div>
                    </div>
                </div>
            </div>
            <div class="dashboard-content">
                <div class="greeting">مرحباً، <span id="displayUsername">المستخدم</span></div>
                <div class="sub-text">مرحباً بك في منصتك المتطورة</div>
                <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
            </div>
        </div>

        <div class="footer">© 2026 LuxWeb — v2.0</div>
    </div>

    <script>
        // ===== جزيئات الخلفية =====
        (function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 60; i++) {
                const span = document.createElement('span');
                const size = Math.random() * 6 + 2;
                span.style.width = size + 'px';
                span.style.height = size + 'px';
                span.style.left = Math.random() * 100 + '%';
                span.style.animationDuration = (Math.random() * 30 + 20) + 's';
                span.style.animationDelay = (Math.random() * 20) + 's';
                container.appendChild(span);
            }
        })();

        // ===== تأثير تموج اسم الموقع =====
        function createWaveTitle() {
            const title = document.getElementById('siteTitle');
            const text = 'LuxWeb';
            title.innerHTML = text.split('').map((char, i) => 
                `<span style="--i:${i}">${char}</span>`
            ).join('');
        }

        // ===== التبويبات =====
        const tabBtns = document.querySelectorAll('.tab-btn');
        const forms = {
            login: document.getElementById('loginForm'),
            register: document.getElementById('registerForm')
        };

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const tab = btn.dataset.tab;
                Object.keys(forms).forEach(key => {
                    forms[key].classList.toggle('active', key === tab);
                });
                document.querySelectorAll('.message').forEach(m => {
                    m.className = 'message';
                    m.textContent = '';
                });
            });
        });

        // ===== دوال مساعدة =====
        function showMessage(element, text, type = 'error') {
            element.textContent = text;
            element.className = `message ${type}`;
        }

        function setLoading(btn, loading) {
            btn.disabled = loading;
            btn.innerHTML = loading ? 
                '<i class="fas fa-spinner fa-spin"></i> جاري...' : 
                btn.dataset.original;
        }

        document.querySelectorAll('.submit-btn').forEach(btn => {
            btn.dataset.original = btn.innerHTML;
        });

        // ===== تسجيل الدخول =====
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const msg = document.getElementById('loginMessage');
            const btn = document.getElementById('loginBtn');

            if (!username || !password) {
                return showMessage(msg, '❌ يرجى ملء جميع الحقول');
            }

            setLoading(btn, true);
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'حدث خطأ');

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                showMessage(msg, '✅ تم تسجيل الدخول بنجاح!', 'success');
                setTimeout(() => showDashboard(data.user), 400);
            } catch (error) {
                showMessage(msg, '❌ ' + error.message);
            } finally {
                setLoading(btn, false);
            }
        });

        // ===== إنشاء حساب =====
        document.getElementById('registerBtn').addEventListener('click', async () => {
            const username = document.getElementById('registerUsername').value.trim();
            const password = document.getElementById('registerPassword').value.trim();
            const msg = document.getElementById('registerMessage');
            const btn = document.getElementById('registerBtn');

            if (!username || !password) {
                return showMessage(msg, '❌ يرجى ملء جميع الحقول');
            }
            if (username.length < 3) {
                return showMessage(msg, '❌ اسم المستخدم يجب أن يكون 3 أحرف على الأقل');
            }
            if (password.length < 6) {
                return showMessage(msg, '❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل');
            }

            setLoading(btn, true);
            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'حدث خطأ');

                showMessage(msg, '✅ تم إنشاء الحساب! يمكنك تسجيل الدخول الآن', 'success');
                document.getElementById('registerUsername').value = '';
                document.getElementById('registerPassword').value = '';
                setTimeout(() => {
                    document.querySelector('[data-tab="login"]').click();
                }, 1200);
            } catch (error) {
                showMessage(msg, '❌ ' + error.message);
            } finally {
                setLoading(btn, false);
            }
        });

        // ===== عرض لوحة التحكم =====
        function showDashboard(user) {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            document.getElementById('displayUsername').textContent = user.username;
            document.getElementById('userBalance').textContent = user.balance;
            createWaveTitle();
        }

        // ===== تسجيل الخروج =====
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('authSection').style.display = 'block';
            document.querySelector('[data-tab="login"]').click();
            document.querySelectorAll('.message').forEach(m => {
                m.className = 'message';
                m.textContent = '';
            });
        });

        // ===== التحقق من الجلسة =====
        (function checkSession() {
            const token = localStorage.getItem('token');
            const userData = localStorage.getItem('user');
            if (token && userData) {
                try {
                    const user = JSON.parse(userData);
                    if (user.username && user.balance !== undefined) {
                        showDashboard(user);
                    }
                } catch (e) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                }
            }
        })();

        // ===== Enter key =====
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const form = input.closest('.form');
                    if (form.id === 'loginForm') {
                        document.getElementById('loginBtn').click();
                    } else if (form.id === 'registerForm') {
                        document.getElementById('registerBtn').click();
                    }
                }
            });
        });

        // ===== تحقق فوري =====
        document.getElementById('registerUsername').addEventListener('input', function() {
            this.style.borderColor = this.value.length >= 3 ? '#34d399' : 
                                     this.value.length > 0 ? '#f87171' : 'rgba(255,255,255,0.06)';
        });
        document.getElementById('registerPassword').addEventListener('input', function() {
            this.style.borderColor = this.value.length >= 6 ? '#34d399' : 
                                     this.value.length > 0 ? '#f87171' : 'rgba(255,255,255,0.06)';
        });
    </script>
</body>
</html>
